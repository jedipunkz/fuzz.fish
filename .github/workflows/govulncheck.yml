name: Govulncheck

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/govulncheck.yml'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
