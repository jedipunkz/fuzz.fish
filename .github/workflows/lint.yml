name: Workflow Lint

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash") 1.7.12
          ./actionlint -version

      - name: Run actionlint
        run: |
          ./actionlint -ignore 'SC2086' -ignore 'SC2035' -ignore 'SC2034' .github/workflows/*.yml

      - name: Install zizmor
        run: pipx install 'zizmor==1.30.1'

      - name: Run zizmor
        run: |
          zizmor --no-online-audits --no-progress .github/workflows/

      - name: Run zizmor (SARIF)
        run: |
          zizmor --no-online-audits --no-progress --format=sarif .github/workflows/ > "${RUNNER_TEMP}/zizmor.sarif"

      - name: Upload SARIF
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
