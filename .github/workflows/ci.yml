name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter Go-relevant changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci*'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  build:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./cmd/fuzz

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  coverage:
    name: Coverage
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Run tests with coverage (head)
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out ./... | tee coverage.txt

      - name: Run tests with coverage (base)
        run: |
          set -o pipefail
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          cd "$RUNNER_TEMP/base"
          go test -coverprofile="$RUNNER_TEMP/coverage-base.out" ./...

      - name: Compute totals
        id: totals
        run: |
          head=$(go tool cover -func=coverage.out | awk '/^total/ {gsub("%", "", $3); print $3}')
          base=$(go tool cover -func="$RUNNER_TEMP/coverage-base.out" | awk '/^total/ {gsub("%", "", $3); print $3}')
          delta=$(awk -v h="$head" -v b="$base" 'BEGIN { printf "%.1f", h - b }')
          {
            echo "head=$head"
            echo "base=$base"
            echo "delta=$delta"
          } >> "$GITHUB_OUTPUT"

      - name: Build coverage report
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo "| Package | Coverage |"
            echo "|---|---|"
            grep '^ok' coverage.txt | \
              awk '{pkg = $2; sub("github.com/jedipunkz/fuzz.fish/", "", pkg); printf "| %s | %s |\n", pkg, $5}'
            echo ""
            echo "Total (head): ${{ steps.totals.outputs.head }}%"
            echo "Total (base): ${{ steps.totals.outputs.base }}%"
            echo "Delta vs base: ${{ steps.totals.outputs.delta }} pp"
          } > coverage-report.md
          cat coverage-report.md

      - name: Fail when total coverage drops
        run: |
          if awk -v h="${{ steps.totals.outputs.head }}" -v b="${{ steps.totals.outputs.base }}" \
            'BEGIN { exit (h + 0.5 < b) ? 0 : 1 }'; then
            echo "::error::Total coverage dropped from ${{ steps.totals.outputs.base }}% to ${{ steps.totals.outputs.head }}% (tolerance 0.5 pp)"
            exit 1
          fi

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: test-coverage
          path: coverage-report.md
