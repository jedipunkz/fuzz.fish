name: AI Review

on:
  pull_request:
    paths:
      - '**.go'
      - 'conf.d/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review against CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Anthropic API key
        id: apikey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set; skipping AI review" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review diff against CLAUDE.md
        if: steps.apikey.outputs.available == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the repository's CLAUDE.md.

            Instructions:
            1. Read CLAUDE.md in the repository root.
            2. Examine the changes in this PR with `gh pr diff ${{ github.event.pull_request.number }}` and by reading the changed files.
            3. Report ONLY concrete violations of the `Code Conventions` and `Security` sections of CLAUDE.md. Do not report style preferences, generic advice, or anything covered by other sections of CLAUDE.md.
            4. For each violation, cite the exact file and line number and quote the CLAUDE.md rule it violates.
            5. Post each finding as an inline PR review comment. If there are no violations, do not post any comments.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
